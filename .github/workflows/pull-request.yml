# ==============================================
# Pull Request Workflow
# ==============================================
# Runs build verification, OpenTofu validation,
# and security scans on pull requests

name: Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

jobs:
  # ==============================================
  # Node CI (lint / typecheck / test / build)
  # ==============================================
  ci:
    uses: domengabrovsek/github-actions/.github/workflows/node-ci.yml@main
    with:
      lint_command: npm run lint
      typecheck_command: npm run typecheck
      test_command: npm run test
      build_command: npm run build
      build_artifact_path: dist/index.mjs

  # ==============================================
  # OpenTofu Validation
  # ==============================================
  opentofu:
    name: OpenTofu Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.9.0

      - name: OpenTofu Format Check
        working-directory: ./terraform
        run: tofu fmt -check

      - name: OpenTofu Init
        working-directory: ./terraform
        run: tofu init -backend=false

      - name: OpenTofu Validate
        working-directory: ./terraform
        run: tofu validate

  # ==============================================
  # Secret Detection
  # ==============================================
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================
  # Security & Privacy Analysis
  # ==============================================
  bearer:
    name: Security & Privacy Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Bearer
        uses: bearer/bearer-action@v2
        with:
          api-key: ${{ secrets.BEARER_TOKEN }}
          format: sarif
          output: bearer-results.sarif
        continue-on-error: true

      - name: Upload Bearer SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: bearer-results.sarif

  # ==============================================
  # OpenTofu Security Scan
  # ==============================================
  opentofu-security:
    name: OpenTofu Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'terraform'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy-results.sarif

  # ==============================================
  # Gate
  # ==============================================
  # Single aggregator check every PR must pass. Branch protection requires the
  # "Gate" status, so required checks stay stable even as the jobs below change.
  gate:
    name: Gate
    if: always()
    needs:
      - ci
      - opentofu
      - gitleaks
      - bearer
      - opentofu-security
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check results
        env:
          RESULTS: >-
            ${{ needs.ci.result }}
            ${{ needs.opentofu.result }}
            ${{ needs.gitleaks.result }}
            ${{ needs.bearer.result }}
            ${{ needs.opentofu-security.result }}
        run: |
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "One or more jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
